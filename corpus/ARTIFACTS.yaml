# Regenerate downloads: bash scripts/corpus-download.sh
# Scan: bash scripts/corpus-scan.sh
# Honesty pass (RP-6 / S-06): substitute-container class; sha256/source_url/fetched_at required.
version: "cp11-3"
schema:
  required_fields:
    - id
    - class
    - license
    - provenance
    - sha256
    - source_url
    - fetched_at
    - status
  class_enum:
    - benchmark
    - firmware
    - oci-app
    - oci-base
    - openwrt
    - rtos-sdk
    - static-binary
    - substitute-container
  status_enum:
    - present
    - missing
  notes: >
    class substitute-container requires field substitutes (what failed download this container stands in for). sha256 is null when status is missing.
