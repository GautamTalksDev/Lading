# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lading

before:
  hooks:
    - go mod tidy

builds:
  - id: lading
    main: ./cmd/lading
    binary: lading
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - DISCLAIMER.md
      - docs/

nfpms:
  - id: lading
    package_name: lading
    vendor: LADING
    homepage: https://github.com/gautamtalksdev/lading
    maintainer: LADING Contributors
    description: Deterministic compliance evidence for binary vulnerability triage
    license: Apache-2.0
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: lading
        dst: /usr/bin/lading
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: lading
    repository:
      owner: gautamtalksdev
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/gautamtalksdev/lading
    description: Deterministic compliance evidence for binary vulnerability triage
    license: Apache-2.0
    install: |
      bin.install "lading"
    test: |
      system "#{bin}/lading", "scan", "--help"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: gautamtalksdev
    name: lading
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
