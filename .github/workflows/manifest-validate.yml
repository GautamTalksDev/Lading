name: Manifest Validate

on:
  pull_request:
    paths:
      - "manifest/**"
      - ".github/**"
      - "scripts/validate-manifests.sh"
      - "scripts/validate-manifest-candidates.sh"
      - "scripts/check-provenance-urls.sh"
      - "scripts/check-manifest-definitive-label.sh"
      - "scripts/check-readme-coverage-sync.sh"
      - "scripts/manifest-pr-gate.sh"
      - ".github/workflows/manifest-validate.yml"
  push:
    branches: [main]
    paths:
      - "manifest/**"
      - ".github/**"
      - "scripts/validate-manifests.sh"
      - "scripts/validate-manifest-candidates.sh"
      - "scripts/check-provenance-urls.sh"
      - "scripts/check-manifest-definitive-label.sh"
      - "scripts/check-readme-coverage-sync.sh"
      - "scripts/manifest-pr-gate.sh"
      - ".github/workflows/manifest-validate.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: manifest-pr-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Manifest PR gate
        run: bash scripts/manifest-pr-gate.sh
