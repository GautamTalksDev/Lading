name: LADING Action Smoke

on:
  push:
    branches: [main]
    paths:
      - 'action/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/lading-action-smoke.yml'
  pull_request:
    paths:
      - 'action/**'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/lading-action-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build findings fixture
        run: mkdir -p /tmp/lading-smoke

      - name: Install LADING from checkout
        run: |
          go build -o "$(go env GOPATH)/bin/lading" ./cmd/lading
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run LADING action (local path)
        uses: ./action
        with:
          artifact-path: testdata/inventory/bin/symver_ssl_elf
          findings-path: testdata/scan/findings-grype.json
          skip-install: "true"
          output-dir: lading-out

      - name: Assert outputs exist
        run: |
          test -d lading-out/evidence-bundle
          test -f lading-out/vex.openvex.json
          test -f lading-out/refusals.json
