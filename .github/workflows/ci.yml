name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.23"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema

      - name: Validate VEX emitter schemas
        run: bash scripts/validate-vex-schemas.sh

      - name: Test with race detector
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

      - name: Test (Windows, CGO off — tree-sitter stub)
        if: matrix.os == 'windows-latest'
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
